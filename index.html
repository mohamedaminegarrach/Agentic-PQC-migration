<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Access · AgentiQ Agent Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#0F1F1A; --muted:#51625B; --line:#D3DCD7;
  --agent:#0B6A64; --agent-bg:#DDEFEC;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0C1311; --surface:#131C19; --ink:#E2EBE6; --muted:#9BAEA6; --line:#283531;
  --agent:#55C3B9; --agent-bg:#123129; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(900px 420px at 50% -10%, var(--agent-bg), transparent 70%), var(--bg);
  color:var(--ink);font:400 16px/1.5 var(--f-body)}
.card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 26px 24px;display:grid;gap:16px;box-shadow:0 18px 50px rgba(15,31,26,.08)}
.eyebrow{font:600 12px/1.3 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--agent)}
h1{font-family:var(--f-display);font-stretch:112%;font-weight:740;font-size:clamp(1.7rem,4vw,2.15rem);line-height:1.05;letter-spacing:-.02em;margin:0}
p{margin:0;color:var(--muted)}
form{display:grid;gap:10px}
label{font-weight:600;font-size:.92rem}
input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;letter-spacing:.04em}
input:focus{outline:2px solid var(--agent);outline-offset:2px}
button{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;padding:13px 16px;font:600 15px var(--f-display);cursor:pointer}
button:hover{background:var(--agent);border-color:var(--agent)}
.err{min-height:1.3em;color:#AE2A20;font-size:.9rem}
@media (prefers-color-scheme: dark){.err{color:#F18C81}}
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">AgentiQ</p>
  <h1>Enter the access code</h1>
  <p>This agent map is shared privately. Enter the code you were given to open it.</p>
  <form id="gate">
    <label for="code">Access code</label>
    <input id="code" name="code" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
    <button type="submit">Open the agent map</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>
<script>
(function(){
  var EXPECTED='d44348e4c88c289b38f94ad715588c168acfe25da44601f3e8c55177faaf5e90';
  var KEY='pqc-access';
  var NEXT='AgentiQ%20Agent%20Map.html';
  var form=document.getElementById('gate');
  var input=document.getElementById('code');
  var err=document.getElementById('err');

  function sha256(text){
    var data=new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', data).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
  }

  try{ if(sessionStorage.getItem(KEY)===EXPECTED) location.replace(NEXT); }catch(e){}

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    err.textContent='';
    if(!window.crypto||!crypto.subtle){
      err.textContent='Open this page from the shared https link so the access check can run.';
      return;
    }
    var code=(input.value||'').trim().toUpperCase();
    sha256(code).then(function(hash){
      if(hash===EXPECTED){
        sessionStorage.setItem(KEY, EXPECTED);
        location.assign(NEXT);
      }else{
        err.textContent='That code is not correct.';
        input.select();
      }
    }).catch(function(){
      err.textContent='The access check could not run in this browser.';
    });
  });
})();
</script>
</body>
</html>
